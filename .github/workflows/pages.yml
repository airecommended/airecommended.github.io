name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync latest public data and generate static HTML
        run: npm run sync

      - name: Verify generated site
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml .nojekyll _site/
          cp -R assets page *-zhongzhuanzhan _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url || steps.deployment2_run.outputs.page_url || steps.deployment3_run.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry Pages deployment (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2_run
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry Pages deployment (attempt 3)
        id: deployment3
        if: steps.deployment2_run.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3_run
        if: steps.deployment2_run.outcome == 'failure'
        uses: actions/deploy-pages@v5
