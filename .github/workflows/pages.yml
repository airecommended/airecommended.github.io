name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync data and generate static HTML
        run: npm run sync

      - name: Verify generated site
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml .nojekyll data.json _site/
          cp -R assets page *-zhongzhuanzhan _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
